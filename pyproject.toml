[project]
name = "market-protocol"
version = "0.3.0"
description = "Generated Python bindings for the market_protocol Protobuf schema"
requires-python = ">=3.12,<3.14"
dependencies = [
    "protobuf==6.31.1",
]

[dependency-groups]
dev = [
    "grpcio-tools==1.74.0",
    "pytest==8.4.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]
